<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#030705">
<meta name="description" content="Live PlayStation Store voucher availability across Indian platforms, plus a shared investor book.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.svg" type="image/svg+xml">
<link rel="icon" href="icons/favicon-48.png" sizes="48x48" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PS Tracker">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<meta name="robots" content="noindex, nofollow">
<title>PS Code Tracker</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="book.css">
<link rel="stylesheet" href="trend.css">
</head>
<body>
<div class="bg" aria-hidden="true"></div>
<header class="bar">
  <div class="brand">
    <span class="mark ps"><svg viewBox="0 0 24 24" role="img" aria-label="PlayStation"><path fill="currentColor" d="M8.984 2.596v17.547l3.915 1.261V6.688c0-.69.304-1.151.794-.991.636.18.76.814.76 1.505v5.875c2.441 1.193 4.362-.002 4.362-3.152 0-3.237-1.126-4.675-4.438-5.827-1.307-.448-3.728-1.186-5.39-1.502zm4.656 16.241l6.296-2.275c.715-.258.826-.625.246-.818-.586-.192-1.637-.139-2.357.123l-4.205 1.5V14.98l.24-.085s1.201-.42 2.913-.615c1.696-.18 3.785.03 5.437.661 1.848.601 2.04 1.472 1.576 2.072-.465.6-1.622 1.036-1.622 1.036l-8.544 3.107V18.86zM1.807 18.6c-1.9-.545-2.214-1.668-1.352-2.32.801-.586 2.16-1.052 2.16-1.052l5.615-2.013v2.313L4.205 17c-.705.271-.825.632-.239.826.586.195 1.637.15 2.343-.12L8.247 17v2.074c-.12.03-.256.044-.39.073-1.939.331-3.996.196-6.038-.479z"/></svg></span>
    <div><h1>PS Code <em>Tracker</em></h1><p id="sub">Last updated</p></div>
  </div>
  <div class="actions">
    <button id="trendBtn" class="btn icon" data-ripple aria-label="Price trends" title="Price trends">
      <svg viewBox="0 0 24 24"><path d="M4 16l5-5 4 4 7-8M15 7h5v5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button id="powerBtn" class="btn icon on" data-ripple aria-label="Live updates" title="Live updates (coming soon)">
      <svg viewBox="0 0 24 24"><path d="M12 3v8M6.3 6.8a8 8 0 1011.4 0" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </div>
</header>
<main id="platforms"></main>

<div id="overlay" class="overlay" hidden>
  <section class="modal" role="dialog" aria-modal="true" aria-labelledby="mTitle">
    <div class="mhead">
      <div><h2 id="mTitle">Rate list</h2><p>Face value &rarr; payout, last 7 days</p></div>
      <button id="closeBtn" class="btn icon sm" data-ripple aria-label="Close">
        <svg viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      </button>
    </div>
    <div class="meta">
      <button id="prev" class="btn icon sm" data-ripple aria-label="Previous day"><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
      <div class="when"><span>Dt <b id="mDate"></b></span><span>Time <b id="mTime"></b></span></div>
      <button id="next" class="btn icon sm" data-ripple aria-label="Next day"><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg></button>
    </div>
    <div id="rates"></div>
  </section>
</div>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="book.js"></script>
<script src="trend.js"></script>
<script>if("serviceWorker" in navigator)addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}));</script>
</body>
</html>
